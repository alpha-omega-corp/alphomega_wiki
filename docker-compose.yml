name: alphomega_wiki

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
      POSTGRES_DB: wiki
    volumes:
      - pgdata_wiki:/var/lib/postgresql/data
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - alphomega-network

  app:
    image: wiki
    # The entrypoint runs `wiki sync` immediately on boot, so the app must wait
    # until Postgres is actually accepting connections — not just "container
    # started". Without this it races the DB and dies with "connection refused".
    # (The db service already defines the healthcheck this waits on.)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alphomega-network
    ports:
      - "1000:1000"
      - "3000:3000"
    volumes:
      - ./server/.env:/app/.env

    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # --- Issuer IDENTITY (must be byte-identical to the `iss` AOAuth stamps,
      #     which is its public/browser-facing URL — AOAuth's own default). ---
      # Browser-facing AOAuth URL for the login redirect (/authorize). A browser
      # cannot resolve host.docker.internal, so this must stay localhost.
      AOAUTH_ISSUER: http://localhost:8080
      # The wiki verifier compares the token's `iss` against this exact string.
      AUTH_ISSUER: http://localhost:8080

      # --- Network REACHABILITY (container -> host -> AOAuth's published :8080).
      #     `localhost` inside this container is the container itself, not AOAuth,
      #     so server-side calls use host.docker.internal instead. ---
      # Where the verifier actually fetches AOAuth's signing keys.
      AUTH_JWKS_URL: http://host.docker.internal:8080/.well-known/jwks.json
      # Server-side token exchange / userinfo / refresh (see session.ts::internalIssuerUrl).
      AOAUTH_INTERNAL_URL: http://host.docker.internal:8080

volumes:
  pgdata_wiki:

networks:
  alphomega-network:
