name: alphomega_wiki

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
      POSTGRES_DB: wiki
    volumes:
      - pgdata_wiki:/var/lib/postgresql/data
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - alphomega-network

  app:
    image: wiki
    # The entrypoint runs `wiki sync` immediately on boot, so the app must wait
    # until Postgres is actually accepting connections — not just "container
    # started". Without this it races the DB and dies with "connection refused".
    # (The db service already defines the healthcheck this waits on.)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alphomega-network
    ports:
      - "1000:1000"
      - "3000:3000"
    volumes:
      - ./server/.env:/app/.env

    env_file:
      - ./docs-app/.env

    # No OAuth config here on purpose: docs-app reads its OAuth vars from
    # docs-app/.env (NUXT_OAUTH_*), and the Go backend reads AUTH_ISSUER /
    # AUTH_JWKS_URL from server/.env (mounted above). docker-compose carries
    # none of it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata_wiki:

networks:
  alphomega-network:
