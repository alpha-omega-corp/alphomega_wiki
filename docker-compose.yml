name: alphomega_wiki

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
      POSTGRES_DB: wiki
    volumes:
      - pgdata_wiki:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - alphomega_wiki_network

  app:
    image: wiki
    networks:
      - alphomega_wiki_network
    ports:
      - "1000:1000"
      - "3000:3000"


    # Maybe
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AOAUTH_ISSUER: http://host.docker.internal:8080
      AUTH_ISSUER: http://host.docker.internal:8080

volumes:
  pgdata_wiki:

networks:
  alphomega_wiki_network:
