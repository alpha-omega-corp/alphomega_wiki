      content: |
        # Deploying to Fly.io

        ## Install flyctl

        ```bash
        curl -L https://fly.io/install.sh | sh
        fly auth login
        ```

        ## Launch

        ```bash
        fly launch
        ```

        Fly generates a `fly.toml` and a `Dockerfile`. Review them, then:

        ```bash
        fly deploy
        ```

        ## Secrets

        ```bash
        fly secrets set API_SECRET=your_secret DATABASE_URL=postgres://...
        ```

- model: Page
  rows:
    - id: 8
      slug: authentication
      title: Authentication
      icon: i-lucide-lock
      published: true
      tags:
        - auth
        - security
        - jwt
      content: |
        # Authentication

        DevDocs uses JWT-based authentication. Tokens are short-lived (1 hour) and
        refreshed automatically via a rotating refresh token stored in an HttpOnly cookie.

        ## Login

        ```http
        POST /auth/login
        Content-Type: application/json

        { "email": "user@example.com", "password": "secret" }
        ```

        **Response:**

        ```json
        { "access_token": "eyJ...", "expires_in": 3600 }
        ```

        ## Token Refresh

        ```http
        POST /auth/refresh
        ```

        The refresh token is read from the cookie automatically. A new access token is returned.

        ## Logout

        ```http
        POST /auth/logout
        ```

        Clears the refresh token cookie server-side.

- model: Page
  rows:
    - id: 9
      slug: authentication-roles
      title: Roles & Permissions
      icon: i-lucide-users
      published: true
      parent_id: 8
      tags:
        - auth
        - roles
        - permissions
      content: |
        # Roles & Permissions

        | Role | Description |
        |------|-------------|
        | `viewer` | Read-only access to published pages |
        | `editor` | Create and edit pages |
        | `admin` | Full access including user management |

        ## Assigning Roles

        Roles are assigned per workspace. An admin can promote any member:

        ```http
        PATCH /workspace/members/:userId
        Content-Type: application/json

        { "role": "editor" }
        ```

        ## Middleware

        Use the `requireRole` middleware to protect routes:

        ```typescript
        export default defineEventHandler(requireRole('editor', async (event) => {
          // handler logic
        }))
        ```

- model: Page
  rows:
    - id: 10
      slug: authentication-sso
      title: SSO / OAuth
      icon: i-lucide-key-round
      published: true
      parent_id: 8
      tags:
        - auth
        - sso
        - oauth
        - oidc
      content: |
        # SSO / OAuth

        DevDocs supports OAuth 2.0 / OIDC providers out of the box.

        ## Supported Providers

        - Google
        - GitHub
        - Microsoft (Entra ID)
        - Any OIDC-compliant provider

        ## Configuration

        ```typescript
        export default defineNuxtConfig({
          runtimeConfig: {
            oauth: {
              google: {
                clientId: process.env.GOOGLE_CLIENT_ID,
                clientSecret: process.env.GOOGLE_CLIENT_SECRET,
              },
            },
          },
        })
        ```

        ## Callback URL

        Register `https://yourdomain.com/auth/callback/:provider` in your OAuth app settings.

