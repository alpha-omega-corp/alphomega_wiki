      slug: deployment-vercel
      title: Deploying to Vercel
      icon: i-lucide-triangle
      published: true
      parent_id: 5
      tags:
        - deployment
        - vercel
      content: |
        # Deploying to Vercel

        ## Prerequisites

        Install the Vercel CLI:

        ```bash
        npm i -g vercel
        ```

        ## Deploy

        ```bash
        vercel deploy --prod
        ```

        Vercel auto-detects Nuxt and sets the correct build command and output directory.

        ## Custom Domain

        In the Vercel dashboard go to **Settings → Domains** and add your domain.
        DNS propagation typically takes under 5 minutes with Vercel's nameservers.

