    - id: 3
      slug: getting-started
      title: Getting Started
      icon: i-lucide-rocket
      published: true
      parent_id: 1
      tags:
        - quickstart
        - setup
        - nuxt
      content: |
        # Getting Started

        Welcome to **DevDocs** — the modern documentation platform built for developers who care about quality and speed.

        ## Prerequisites

        Before you begin, ensure you have the following installed:

        - **Node.js** 18.x or later
        - **npm** 9.x, **pnpm** 8.x, or **yarn** 1.x
        - A code editor (we recommend VS Code)

        ## Quick Install

        The fastest way to get started is with our CLI tool:

        ```bash
        npx create-my-app my-project
        cd my-project
        npm run dev
        ```

        Your development server will start at `http://localhost:3000`.

        ## Manual Setup

        ### 1. Create a new project

        ```bash
        mkdir my-project && cd my-project
        npm init -y
        ```

        ### 2. Install dependencies

        ```bash
        npm install nuxt @nuxt/ui @nuxt/content
        ```

        ### 3. Create your config file

        Create a `nuxt.config.ts` at the root of your project:

        ```typescript
        export default defineNuxtConfig({
          modules: ['@nuxt/ui', '@nuxt/content'],
        })
        ```

        ### 4. Start the server

        ```bash
        npm run dev
        ```

        ## Project Structure

        ```
        my-project/
        ├── assets/
        │   └── css/
        │       └── main.css
        ├── components/
        ├── content/
        │   └── docs/
        ├── layouts/
        │   └── default.vue
        ├── pages/
        │   ├── index.vue
        │   └── docs/
        │       └── [...slug].vue
        ├── nuxt.config.ts
        └── package.json
        ```

        ## Next Steps

        - [Installation](/docs/installation) — detailed setup for different environments
        - [Configuration](/docs/configuration) — all available config options
        - [Architecture](/docs/architecture) — understand how the system works

- model: Page
  rows:
    - id: 4
      slug: configuration
      title: Configuration
      icon: i-lucide-settings
      published: true
      parent_id: 2
      tags:
        - config
        - settings
        - typescript
      content: |
        # Configuration

        DevDocs is configured through `nuxt.config.ts`. This page documents every available option.

        ## Basic Configuration

        ```typescript
        export default defineNuxtConfig({
          modules: ['@nuxt/ui', '@nuxt/content'],

          app: {
            head: {
              title: 'My Docs',
              meta: [
                { name: 'description', content: 'My documentation site' }
              ]
            }
          },

          runtimeConfig: {
            apiSecret: process.env.API_SECRET,
            public: {
              appName: process.env.NUXT_PUBLIC_APP_NAME || 'DevDocs',
            }
          },
        })
        ```

        ## Content Configuration

        ```typescript
        export default defineNuxtConfig({
          content: {
            build: {
              markdown: {
                highlight: {
                  theme: {
                    default: 'github-light',
                    dark: 'github-dark',
                  },
                  langs: ['ts', 'js', 'vue', 'bash', 'json'],
                },
                remarkPlugins: {},
                rehypePlugins: {},
              },
            },
            navigation: {
              fields: ['title', 'description', 'order'],
            },
          },
        })
        ```

        ## UI Configuration

        ```typescript
        export default defineNuxtConfig({
          ui: {
            primary: 'violet',
            neutral: 'slate',
          },
        })
        ```

        ## Available Colors

        The following colors are available as `primary`:

        - `red` `orange` `amber` `yellow` `lime`
        - `green` `emerald` `teal` `cyan` `sky`
        - `blue` `indigo` `violet` `purple` `fuchsia`
        - `pink` `rose`

        ## TypeScript Configuration

        ```json
        {
          "extends": "./.nuxt/tsconfig.json",
          "compilerOptions": {
            "strict": true,
            "noUncheckedIndexedAccess": true
          }
        }
        ```

        ## Performance Options

        ```typescript
        export default defineNuxtConfig({
          devtools: { enabled: true },

          nitro: {
            compressPublicAssets: true,
            minify: true,
          },

          vite: {
            optimizeDeps: {
              include: ['@tiptap/vue-3'],
            },
          },
        })
        ```

